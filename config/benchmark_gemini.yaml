run_profile: development
input_mode: raw
answer_mode: plan_tools
prompt_version: planner_v1
schema_version: plan_v1
context_policy: full_table
max_workers: 1
queries: data/Public data 1/queries.json
data_dir: data/Public data 1/xlsx_files
run_root: runs
llm:
  provider: gemini
  model: gemini-3.5-flash-lite
  # Gemini rejects the full planner schema as INVALID_ARGUMENT because it is
  # too complex/deep. Request JSON only; the same plan schema is still enforced
  # locally after every response.
  json_mode: json_object
  max_output_tokens: 20000
  request_timeout_seconds: 90
  max_api_attempts: 3
  max_planner_repair_calls: 1
  provider_options:
    gemini:
      api_key_env: GEMINI_API_KEY
      api_surface: generate_content
      thinking_level: low
      rate_limit:
        enabled: true
        requests_per_minute: 5
        input_tokens_per_minute: 200000
        window_seconds: 60
        token_estimate_safety_factor: 1.25
        max_wait_seconds: 120
query_timeout_seconds: 240
run_timeout_seconds: 2400
submission_policy: fail_run
